        <div style="display: flex;">
            <div style="padding-left: 3%;">
                <div class="terminal-boot">
                    <h1 class="big-header">Welcome back Architect.</h1>
                </div>
            </div>
            <!-- <h1 id="live-date-display" style="margin: 3rem 0 0 39%;"></h1> -->

        <div class="block-container" style="padding-left:3%;">
            <div class="sub-block"> 
                <p>CLASSES TODAY</p>
                <h1 id="today-classes-counter" style="font-size: 48px; width: 325px; color:#DAB9FF;"></h1>
            </div>
            <div class="sub-block">    
                <p>TASKS TODAY</p>
                <h1 id="today-tasks-counter" style="font-size: 48px; width: 325px;"></h1>
            </div>
            <div class="sub-block">    
                <p>TASKS DUE THIS WEEK</p>
                <h1 id="this-week-tasks-counter" style="font-size: 48px; width: 325px; color: #D4CA38;"></h1>
            </div>
        </div>

        <div class="dashboard" style="padding-left: 3%; padding-right: 3%;">
           
            <section class="schedule-section" style="display: block; ">
                <div style="display: flex; padding-top: 2%;">
                    <h1>Today's Schedule</h1> 
                    <p id="schedule-date" style="padding-top: 2%; margin-left: 52%; opacity: 0.7; color: #71717A;"></p>
                </div>
                <div class="timeline" id="dashboard-timeline">
                    <div class="timeline-item" id="dashboard-schedule">
                        <div class="dot active"></div>
                        <div class="card highlighted">
                            <span class="time"></span>
                            <h1></h1>
                            <p style="opacity: 0.5; margin-top: -6px ;"></p>
                        </div>
                    </div>
                        
                    <div class="timeline-item">
                        <div class="dot"></div>
                        <div class="card">
                            <span class="time"></span>
                            <h1></h1>
                            <p style="opacity: 0.5; margin-top: -6px ;"></p>
                        </div>
                    </div>
                
                    <div class="timeline-item">
                        <div class="dot"></div>
                        <div class="card">
                            <span class="time"></span>
                            <h1></h1>
                            <p style="opacity: 0.5; margin-top: -6px ;"></p>
                        </div>
                    </div> 
                </div>
            </section>
            
            <section class="tasks">
                <div class="tasks-header">
                    <h1>Priority Tasks</h1>
                    <span id="view-all-tasks" class="view-all-tasks" style="cursor: pointer;">VIEW ALL</span>
                </div>
                <div class="task-list" id="dashboard-tasks" style="padding-top: 3%;">
                    <div class="smallcard">
                        <h3></h3>
                        <p style="opacity: 0.5; padding-top: 2%;"></p>
                    </div>  
                    
                    <div class="smallcard">
                        <h3></h3>
                        <p style="opacity: 0.5;padding-top: 2%;"></p>
                    </div>  
                    <div class="smallcard">
                        <h3></h3>
                        <p style="opacity: 0.5;padding-top: 2%;"></p>
                    </div>
                    <div class="smallcard">
                        <h3></h3>
                        <p style="opacity: 0.5;padding-top: 2%;"></p>
                    </div>
                </div>
            </section>
        </div>
